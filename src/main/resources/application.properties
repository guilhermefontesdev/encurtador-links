spring.application.name=encurtador

# Conexão com o banco (os mesmos valores do docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:3245/encurtador
spring.datasource.username=encurtador
spring.datasource.password=encurtador

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Endereço usado para montar o link curto na resposta
app.base-url=http://localhost:8080